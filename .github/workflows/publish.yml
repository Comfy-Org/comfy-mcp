name: Publish to PyPI

# Publishing is driven by a GitHub Release, not by a push to a branch: the
# release is the human act, and the tag it carries is the only input. There is
# deliberately no `workflow_dispatch` — a hand-triggered publish could ship a
# version no tag points at, and a PyPI version number can never be reused.
on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  # The version lives in TWO places in this repo — `pyproject.toml` and
  # `src/comfy_mcp/__init__.py` — so a release can disagree with the package it
  # would publish in two different ways. Check both against the tag BEFORE
  # building, in a job that needs no credentials: an unpublishable release
  # should fail here, cheaply, rather than after the OIDC exchange.
  #
  # (comfy-cli needs no equivalent check because it keeps `version = "0.0.0"` in
  # the repo and its workflow rewrites it from the tag. This repo carries a real
  # version instead, which is friendlier to `pip install -e .` and to
  # `__version__` at runtime, and the cost is exactly this guard.)
  check-version:
    name: Tag matches the packaged version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The whole check is one Python program fed through a QUOTED heredoc, so
      # the shell performs no expansion on it at all. Both version strings need
      # quote characters to parse, and nesting those inside `python -c "…"` is a
      # quoting puzzle whose failure mode is a workflow that breaks at release
      # time — the worst possible moment to debug escaping. The tag arrives via
      # the environment instead of being interpolated into the source.
      - name: Compare the tag against pyproject.toml and __init__.py
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, re, sys, tomllib

          tag = os.environ["TAG"]
          version = tag[1:] if tag.startswith("v") else tag
          print(f"tag={tag} -> version={version}")

          # Read the authoritative value rather than grepping for it. tomllib is
          # stdlib from 3.11, so this needs no dependency.
          with open("pyproject.toml", "rb") as fh:
              project = tomllib.load(fh)["project"]["version"]

          # Parse `__version__` instead of importing the package: an import
          # would pull in `mcp` and every runtime dependency to read a string.
          src = pathlib.Path("src/comfy_mcp/__init__.py").read_text()
          match = re.search(r"""^__version__\s*=\s*["']([^"']+)""", src, re.M)
          dunder = match.group(1) if match else None
          print(f"pyproject.toml={project} __init__.py={dunder}")

          problems = []
          if project != version:
              problems.append(f"pyproject.toml version {project!r} != tag {tag!r}")
          if dunder != version:
              problems.append(
                  f"src/comfy_mcp/__init__.py __version__ {dunder!r} != tag {tag!r}"
              )
          for problem in problems:
              print(f"::error::{problem}")
          if problems:
              print(
                  f"::error::Set the version to {version} in BOTH files, then "
                  "re-cut the release. Nothing was published."
              )
              sys.exit(1)
          print("Versions agree.")
          PY

  build-and-publish:
    name: Build and publish to PyPI
    needs: check-version
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Mandatory for PyPI trusted publishing (OIDC). No API token is stored:
      # PyPI is configured to trust this repository + this workflow filename,
      # so there is no long-lived credential to leak or rotate.
      id-token: write
      # A job-level permissions block zeroes every permission it does not name,
      # including the workflow-level `contents: read` — without this line the
      # job's own checkout fails on a private repo with "repository not found"
      # (how v0.7.0's first publish attempt died).
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build --sdist --wheel --outdir dist/

      - name: Check the built metadata
        run: |
          python -m pip install --upgrade twine
          # Catches a README that renders on GitHub but breaks PyPI's stricter
          # parser — worth knowing before the upload, since the version cannot
          # be republished afterwards.
          python -m twine check dist/*

      # Pinned to the same commit comfy-cli's publish workflow already trusts,
      # rather than a floating tag: a mutable ref on the action that uploads
      # your package is the supply-chain edge worth nailing down, and matching
      # the sibling repo means one SHA to review when it is bumped.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  verify-install:
    name: Install from PyPI and smoke-test
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # The floor this package declares, so the published wheel is proven
          # installable on the oldest interpreter it claims to support.
          python-version: '3.10'

      - name: Install the published version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          # PyPI's index can lag a successful upload by a minute or two, so
          # retry rather than fail the job on propagation delay.
          for i in 1 2 3 4 5 6 7 8; do
            pip install --no-cache-dir "comfy-mcp==${VERSION}" && exit 0
            echo "Attempt ${i}: not on the index yet, waiting 15s..."
            sleep 15
          done
          echo "::error::comfy-mcp==${VERSION} did not install after 8 attempts."
          exit 1

      - name: Import the package and confirm the version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          # Import rather than run the server: starting it would look for
          # comfy-cli, which is the USER's dependency and deliberately not
          # bundled (see AGENTS.md), so its absence is not a packaging failure.
          INSTALLED=$(python -c "import comfy_mcp; print(comfy_mcp.__version__)")
          echo "imported comfy_mcp ${INSTALLED}"
          test "${INSTALLED}" = "${VERSION}"

  # The listing in the official MCP Registry (registry.modelcontextprotocol.io),
  # which is the directory MCP clients search for installable servers. It is a
  # separate publish from PyPI's and a separate identity: PyPI knows this project
  # as the distribution `comfy-mcp`, the registry knows it as
  # `io.github.Comfy-Org/comfy-mcp`, and the entry is what ties the two together.
  #
  # It runs after `verify-install` rather than after `build-and-publish` because
  # the registry does not take the listing on trust: it fetches
  # `https://pypi.org/pypi/comfy-mcp/<version>/json` and refuses to publish until
  # that exact version exists AND its description carries the ownership token (see
  # README.md's `mcp-name:` comment). `verify-install` is precisely the job that
  # waits out PyPI's index lag, so hanging this off it turns a race into a
  # dependency. `verify-install` needs `build-and-publish` needs `check-version`,
  # so the tag has already been proven to match both packaged version files by the
  # time this job reads it — that check is inherited, not repeated here.
  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: verify-install
    runs-on: ubuntu-latest
    permissions:
      # Scoped to THIS job, not the workflow: `id-token: write` mints an OIDC
      # token for this repository, and the only step that should be able to
      # obtain one is the publisher login below. A job-level block zeroes what it
      # does not name, so `contents: read` is restated for the checkout (the same
      # reason `build-and-publish` restates it).
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Sync server.json to the release tag
        env:
          # The same input `check-version` reads, so both jobs derive the version
          # from one source. `GITHUB_REF` would also work on this trigger, but a
          # release can be created against a tag whose ref this job did not check
          # out, and there is no reason for the two jobs to disagree about where
          # the number comes from.
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # The committed version in server.json is only a seed; the tag is the
          # source of truth, so the listing always matches the release with no
          # hand-editing. Guard it before it reaches a PUBLIC directory: an entry
          # published under a garbage version cannot be quietly withdrawn, and
          # `check-version` has only proven the tag equals the packaged version —
          # not that either is canonical. Every release here is a plain vX.Y.Z, so
          # reject leading zeros and any prerelease/build suffix (v01.2.3,
          # v1.2.3-rc.1) rather than smuggle a non-canonical version into the
          # registry.
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Refusing to publish: '${TAG}' is not a canonical vX.Y.Z release tag"
            exit 1
          fi
          # BOTH versions: the server version and the PyPI package version the
          # registry resolves. Leaving `.packages[].version` at the committed seed
          # would point a freshly published listing at whatever release happened
          # to be current when the file was last touched.
          jq --arg v "$VERSION" '.version = $v | .packages[].version = $v' \
            server.json > server.tmp
          mv server.tmp server.json
          # `jq -e` so a rewrite that silently matched nothing (a renamed field, an
          # emptied `packages` array) fails here rather than publishing the seed.
          jq -e --arg v "$VERSION" \
            '.version == $v and (.packages | length > 0) and all(.packages[]; .version == $v)' \
            server.json > /dev/null
          echo "server.json pinned to ${VERSION}"
          cat server.json

      # Pin mcp-publisher to an explicit release and verify the download against
      # that release's published SHA256 before extracting or executing it. This
      # job holds `id-token: write`, so an unpinned `releases/latest` binary would
      # run — and receive an OIDC token for this repository — with no supply-chain
      # guarantee whatsoever. Pin + verify closes that. Bump the version here
      # deliberately; `checksums.txt` comes from the same pinned release, so the
      # two can never drift apart.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64 | arm64) arch=arm64 ;;
            *) echo "::error::Unsupported architecture: $(uname -m)"; exit 1 ;;
          esac
          asset="mcp-publisher_${os}_${arch}.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o "$asset" "${base}/${asset}"
          curl -fsSL -o checksums.txt "${base}/registry_${MCP_PUBLISHER_VERSION#v}_checksums.txt"
          # Anchored to end-of-line so the sibling `<asset>.sbom.json` entry cannot
          # be the line that gets checked. A grep that matches nothing exits 1 and
          # `pipefail` fails the step, so a renamed asset cannot skip verification.
          grep " ${asset}\$" checksums.txt | sha256sum -c -
          tar xzf "$asset" mcp-publisher

      # Exchanges the job's OIDC token for a registry credential. The namespace
      # grant is CASE-SENSITIVE and scoped to `io.github.Comfy-Org/*`, which is why
      # server.json spells the org exactly as GitHub does.
      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
