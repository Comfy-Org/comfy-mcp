name: comfy-cli contract

# Weekly + on-demand check that the REAL comfy-cli still speaks the
# argv/envelope contract the mocked unit suite assumes. Deliberately not a
# PR gate: a failure here means comfy-cli drifted, which no PR to this repo
# can cause or fix — gating PRs on it would block unrelated work.
# NOTE: GitHub disables `schedule` after 60 days of repo inactivity; after a
# quiet spell run it by hand:
#   gh workflow run cli-contract.yml -R Comfy-Org/comfy-mcp

on:
  schedule:
    - cron: '0 7 * * 1' # weekly, Monday 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install this server and the latest released comfy-cli
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install comfy-cli
          comfy --version
      - name: Run the contract tests against the real binary
        run: pytest tests/contract -m cli_contract -q
