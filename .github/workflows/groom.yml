name: Groom

# Thin caller for the shared reusable code-cleanup sweep. All the logic (the
# two-phase finder -> independent verifier audit, the durable dedup ledger, the
# GitHub-issue sink) lives in Comfy-Org/github-workflows — this repo carries
# only the pin, exactly like agents-md-integrity.yml and ci-cursor-review.yml.
# Keep `workflows_ref` equal to the `uses:` SHA so a run always loads the briefs
# and ledger that match the workflow filing the issues; the upstream bump
# dispatcher (GROOM_CALLERS) opens SHA-bump PRs automatically once registered.
#
# AUTO-BUILDER ON (`builder: true` below): the top `max_prs` CONFIRMED,
# non-security findings become REVIEW-GATED PRs; groom never merges. Review
# them against the thin-wrapper rule in AGENTS.md — "every tool is a
# `comfy --json --where local` passthrough" — which a refactor agent cannot
# judge from the code alone: the most "duplicated"-looking passthroughs are
# duplicated ON PURPOSE, because collapsing them would move behavior out of
# comfy-cli and into this repo. Close a builder PR that does that.
#
# PREREQUISITES (operator) — ALL are hard requirements with the builder on:
#   - `secrets.ANTHROPIC_API_KEY` must reach this repo (org- or repo-level): the
#     finder and verifier agents bill through it, and the reusable declares it
#     `required: true`, so an absent key fails LOUD at the agent step.
#   - `vars.APP_ID` + `secrets.CLOUD_CODE_BOT_PRIVATE_KEY`: no longer optional.
#     `build_select` hard-fails `builder=true` with an empty `bot_app_id`, and
#     `build_pr` has no github.token fallback — after the agents have billed.
#   - the cloud-code-bot App INSTALLED on this repo with contents, pull-requests
#     AND issues: write — `build_pr` mints its token with all three, and a
#     missing grant fails that mint the same post-billing way.

on:
  schedule:
    # DAILY base tick — deliberately NOT the effective cadence. GitHub Actions
    # cron is static in the file, so "every N days" is implemented as a frequent
    # base tick plus the reusable's runtime interval gate: a tick within
    # GROOM_INTERVAL_DAYS of the last real run no-ops cheaply, before the finder
    # ever spins up. Never fires on a PR. 10:41 UTC is off-peak and off the hour
    # to dodge top-of-hour scheduler congestion, and staggered from the other
    # groom callers so the org's runs do not all land in one minute.
    - cron: '41 10 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Run the full audit + dedup but do NOT open issues — print what WOULD be
          filed to the job summary. Use this for the first run to confirm the
          agent credentials resolve and to eyeball finding quality before
          trusting live filing.
        type: boolean
        default: false

# NOTE: intentionally NO caller-level `concurrency:`. The reusable already
# declares `concurrency: groom-${{ github.repository }}` (cancel-in-progress:
# false), which is the real TOCTOU guard for the read-then-file dedup ledger.
# Repeating that same group here would DEADLOCK the run — the caller would hold
# the group while its `uses:` job waits on the identical group, and with
# cancel-in-progress:false the nested job never gets the slot.

jobs:
  groom:
    permissions:
      # REQUIRED UNION, and it is not optional paperwork: a reusable's nested
      # jobs cannot request more GITHUB_TOKEN scope than the caller grants, and
      # GitHub validates that at STARTUP — before any job runs. A short grant
      # fails the whole run with an opaque "workflow file issue" and zero jobs,
      # not a clean error. At the pinned SHA: `file` needs issues: write;
      # `build_select` needs issues: read + pull-requests: read; `gate` needs
      # actions: read to find the last real run in this workflow's history.
      # Omitting `actions: read` REJECTS the run outright ("requesting
      # 'actions: read', but is only allowed 'actions: none'") — it does not
      # quietly degrade to running every tick. The agent jobs need nothing
      # beyond contents: read: they invoke the Claude CLI directly and mint no
      # GitHub token, so `id-token: write` is not required at this SHA.
      #
      # Re-derived against 02fe484 (the SHA pinned below), not inherited from the
      # previous pin: the reusable's own `groom.yml` is BYTE-IDENTICAL between
      # ece4c3e and 02fe484 — that bump touches only the groom assets loaded via
      # `workflows_ref` (ledger.py, verifier.md, README) plus an unrelated
      # workflow — so the union below is unchanged by construction. Union of the
      # nested jobs' declared scopes at 02fe484: `gate` contents+actions+issues+
      # pull-requests: read; `build_select` contents+issues+pull-requests: read;
      # `file` contents: read + issues: write; every agent job (audit_find,
      # audit_verify, build, build_pr) contents: read only. No job-level `uses:`,
      # so there is no further nesting to union in, and `id-token` appears
      # nowhere outside a comment.
      #
      # When you bump the SHA, redo this derivation rather than copying the
      # comment forward — diff the reusable's `groom.yml` across the two SHAs;
      # if it changed, re-grep its `permissions:` blocks.
      contents: read
      issues: write
      pull-requests: read
      actions: read
    uses: Comfy-Org/github-workflows/.github/workflows/groom.yml@23c7b69392d08e57f545d393faa391e43cf4dd55 # github-workflows main (23c7b69)
    with:
      # Keep the assets ref (finder/verifier briefs, interval gate, dedup ledger)
      # in lock-step with the `uses:` SHA above. Bump both together.
      workflows_ref: 23c7b69392d08e57f545d393faa391e43cf4dd55
      # File as cloud-code-bot so groom's issues are a distinct, queryable actor
      # rather than github-actions[bot]. REQUIRED now that `builder: true` is
      # set: unset, `build_select` hard-fails instead of falling back.
      bot_app_id: ${{ vars.APP_ID }}
      # Turn the top `max_prs` CONFIRMED, non-security findings into REVIEW-GATED
      # PRs instead of issues, which is what `vars.GROOM_CONFIG`'s `max_findings: 0`
      # here already assumes: that value PARKS issue filing (a literal `[:0]`
      # slice, not "unlimited"), so without the builder this repo runs the full
      # finder + verifier and emits nothing at all.
      #
      # That same `max_findings: 0` still slices the `file` job, which with the
      # builder on receives every finding the builder may NOT take: security /
      # auth-adjacent findings, DOWNGRADE verdicts, and anything past `max_prs`.
      # At 0 those reach NO sink (a `::warning::` only) and, never filed, stay
      # out of the dedup ledger, so they are re-found next run. Raise
      # `max_findings` in the variable if those should still arrive as issues.
      #
      # HARD PREREQUISITE — do not merge before it is met. `build_pr` reads
      # `steps.bot_token.outputs.token` with NO github.token fallback (the issue
      # sink degrades to github-actions[bot]; the PR sink cannot), and callers
      # grant only `contents: read`, so there is no other way to push a branch.
      # This repo has NEITHER `vars.APP_ID` NOR `secrets.CLOUD_CODE_BOT_PRIVATE_KEY`
      # today, so builder mode would kill every finding at the PR sink AFTER the
      # agents have billed. Provision the PRIVATE KEY FIRST and the APP_ID SECOND:
      # the reusable mints whenever bot_app_id is non-empty and hard-fails on an
      # empty key, so the reverse order breaks the runs that currently work.
      # The App installation also needs contents, pull-requests AND issues:
      # write (see PREREQUISITES at the top of this file).
      builder: true
      # Precedence is `with:` < `vars.GROOM_CONFIG` < `config`, and the variable
      # sets max_prs (currently 2), so the variable governs. This line is the
      # FLOOR it falls back to: the resolver drops a malformed variable (or a
      # missing key) to this layer, and without it that typo would silently
      # lift the cap to the reusable's default of 5 PRs per run.
      max_prs: '2'
      # Manual dispatch may dry-run; the schedule always files live
      # (github.event.inputs is null on a schedule -> '' != 'true' -> false).
      # `vars.GROOM_CONFIG` outranks this too: a `dry_run` key there overrides a
      # dispatched dry run, so keep that variable free of `dry_run`.
      dry_run: ${{ github.event.inputs.dry_run == 'true' }}
      # Effective cadence, re-read every run, so retuning needs no edit to this
      # file:
      #   gh variable set GROOM_INTERVAL_DAYS --repo Comfy-Org/comfy-mcp --body 7
      # `|| '7'` is ONLY the fallback for a MISSING variable — it is NOT the
      # effective cadence and does not mean "weekly by default". This repo
      # already defines GROOM_INTERVAL_DAYS, so the variable governs the spend,
      # not this line. It is set to 1 (= a real audit every day the repo had a
      # merge) as of this PR. Read it before assuming weekly:
      #   gh variable get GROOM_INTERVAL_DAYS --repo Comfy-Org/comfy-mcp
      interval_days: ${{ vars.GROOM_INTERVAL_DAYS || '7' }}
      # Match the volume-gate window to the EFFECTIVE cadence above, not the
      # daily base cron, so "did anything merge since the last real run?" spans
      # the right window. Wired to the one variable so the two gates cannot drift.
      cadence: ${{ vars.GROOM_INTERVAL_DAYS || '7' }}
      # A dry-run is the pre-trust spot-check, so it must always reach the audit:
      # bypass the volume gate when dispatched with dry_run:true, or a quiet week
      # would gate it to nothing and print no summary — defeating the point. Live
      # runs keep the gate on so a quiescent repo still skips the spend.
      volume_gate: ${{ github.event.inputs.dry_run != 'true' }}
      # Below the default of 12. This is a ~30-file repo whose entire source is
      # one server module plus three leaves, so a cap sized for a large service
      # would mostly buy restatements of the same few observations. Raise it if
      # real findings start hitting the ceiling. Like `max_prs`, this is only
      # the fallback layer: `vars.GROOM_CONFIG` currently sets `max_findings: 0`
      # and outranks it (see the builder comment above).
      max_findings: 5
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BOT_APP_PRIVATE_KEY: ${{ secrets.CLOUD_CODE_BOT_PRIVATE_KEY }}
