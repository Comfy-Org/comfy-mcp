# Dependabot configuration
# Docs: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Two ecosystems for this small Python repo: the pip dependencies declared in
# pyproject.toml, and the SHA-pinned GitHub Actions in the workflows. No Docker
# image ships from this repo, so there is no docker ecosystem.
version: 2

updates:
  # pip — runtime + dev dependencies (pyproject.toml)
  - package-ecosystem: 'pip'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    groups:
      pip-dependencies:
        patterns: ['*']
    labels: ['dependencies']
    open-pull-requests-limit: 5

  # GitHub Actions — the SHA-pinned actions across all workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      github-actions:
        patterns: ['*']
    labels: ['dependencies']
    open-pull-requests-limit: 3
    ignore:
      # NEVER let Dependabot bump the Comfy-Org/github-workflows reusables: a caller
      # pins them TWICE (`uses:` SHA + `workflows_ref:` input) and Dependabot only
      # rewrites `uses:`, splitting the pair. The bump-*-callers fleet in
      # github-workflows moves both pins together. Dependabot names a reusable by
      # its FULL path and a bare `dependency-name` is an exact match, so the `/*`
      # entry is the load-bearing one; the bare entry is defense-in-depth for a
      # future root-level action ref (`uses: Comfy-Org/github-workflows@<sha>`).
      # Do NOT collapse to `Comfy-Org/github-workflows*` (it would also match any
      # sibling repo whose name merely starts with `github-workflows`).
      - dependency-name: 'Comfy-Org/github-workflows'
      - dependency-name: 'Comfy-Org/github-workflows/*'
