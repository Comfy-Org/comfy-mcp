[project]
name = "comfy-local-mcp"
version = "0.4.0"
description = "Local MCP server for ComfyUI — a thin wrapper over comfy-cli."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Comfy Org" }]
dependencies = [
    # >= 2 because that is where `mcp.server.mcpserver` exists: the SDK's 2.0.0
    # DELETED `mcp.server.fastmcp` outright — no shim, no deprecation window —
    # and this server's single SDK import (`from mcp.server.mcpserver import
    # Context, Image, MCPServer`, server.py) resolves on 2.x only. On 1.x it is
    # an ImportError that takes the whole suite down at conftest collection
    # rather than at any one test. (Historical floors this supersedes: >= 1.10
    # for elicitation, >= 1.14 to survive `ctx: Context | None` tool parameters.)
    #
    # < 3 for the same reason the `< 2` cap existed before this port: a major
    # release must arrive as a reviewable Dependabot PR, not as unrelated PRs'
    # CI turning red hours after a release nobody here asked for.
    #
    # `mcp-types` is deliberately NOT declared, and the two facts behind that
    # only look like a contradiction: 2.x split the wire types out into a
    # standalone `mcp-types` distribution, AND kept `mcp.types` inside the `mcp`
    # distribution as a module that mirrors it (every name is the same object),
    # which is the spelling `server.py` imports. The version is bounded either
    # way — `mcp` 2.0.0 requires `mcp-types==2.0.0`, an EXACT pin, so a breaking
    # `mcp-types` major cannot arrive except via an `mcp` release, which this
    # `< 3` ceiling already gates into a reviewable Dependabot PR.
    #
    # `requires-python = ">=3.10"` above still holds: `mcp` 2.0.0 and
    # `mcp-types` 2.0.0 both declare `Requires-Python: >=3.10`, so the major
    # bump did not raise the floor out from under the 3.10 CI leg.
    "mcp>=2,<3",
    # Already an mcp dependency; declared explicitly because this server now
    # imports it directly for the elicitation response schema.
    "pydantic>=2",
]
# comfy-cli is intentionally NOT a declared dependency: this server shells out
# to whatever `comfy` binary PATH/COMFY_BIN resolves to (which may differ from a
# pip-installed one), and the envelope/discover contract it wraps is carried by a
# specific comfy-cli build rather than a hard-pinnable PyPI release. Compatibility
# is enforced at RUNTIME instead — `server_info` asserts the comfy-cli envelope
# schema major and, when COMFY_CLI_MIN_VERSION is set, a minimum version. See
# src/comfy_local_mcp/server.py (ENVELOPE_SCHEMA_MAJOR / MIN_COMFY_CLI_VERSION).

[project.optional-dependencies]
# The ruff floor is 0.16, not 0.15, because `[tool.ruff.lint] select` below now
# enables RUF100 (unused-`noqa`) — and 0.16 narrowed BLE001 to stop flagging a
# blind `except` that logs its exception. Under 0.15 those handlers still need a
# `# noqa: BLE001`; under 0.16 that same directive is an unused-directive error.
# A range spanning that change cannot be green on both, so pin past it: a lint
# toolchain whose verdicts differ by patch release is the exact problem the
# pinned rule selection exists to prevent.
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[project.scripts]
comfy-local-mcp = "comfy_local_mcp.server:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "e2e: live end-to-end smoke test; needs a running local ComfyUI + comfy-cli (skips otherwise)",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Pin the rule selection EXPLICITLY rather than inheriting ruff's defaults.
#
# ruff 0.16 expanded its default selection from 59 rules to 413. With no
# `select` this repo silently inherited all of them, so a routine dev-dependency
# bump turned a green tree red with 60 findings — 52 of them stale `# noqa: ARG0xx`
# directives for a rule that was never enabled, plus 8 genuine ones.
#
# The first four are ruff's historical defaults: the set this codebase was
# written and reviewed against. Widening them is a deliberate decision, not
# something a linter release should make on our behalf — so widen here, in a PR,
# on purpose. What follows is that deliberate widening, one rule set at a time:
#
# ASYNC  — blocking calls inside `async def`. This server's whole job is shelling
#          out from async tools, so a blocking spawn or read on the event loop is
#          the highest-value defect class ruff can find here.
# BLE    — blind `except Exception`. Every remaining site now states its reason:
#          the handlers that log the exception satisfy the rule outright (0.16
#          exempts those), and the few that genuinely must swallow carry an
#          explicit `# noqa: BLE001 - <reason>`. The rule now forces the NEXT
#          blind catch to argue for itself the same way.
# S110   — `try`/`except`/`pass`. Selected as a single rule rather than all of
#          `S` (flake8-bandit): the broader set flags `subprocess` use itself,
#          which is this repo's entire reason to exist.
# I      — import sorting. Cosmetic and auto-fixable; on so it cannot drift.
# RUF100 — unused/non-enabled `# noqa`. This is the rule that would have PREVENTED
#          the mess this selection was written for: ~50 `# noqa: ARG0xx`
#          directives had accumulated for `flake8-unused-arguments`, a rule this
#          repo has never enabled, and nothing flagged them until a linter
#          release changed its defaults. With RUF100 on, a directive that
#          suppresses nothing is an error the day it is written.
#
# Deliberately NOT adopted: ARG (flake8-unused-arguments). The tests are largely
# interface-mirroring fakes whose unused parameters exist precisely BECAUSE the
# real signature has them, so the rule reports 306 sites here and finds no
# defects. The ~50 stale directives were removed rather than completed.
select = ["E4", "E7", "E9", "F", "ASYNC", "BLE", "S110", "I", "RUF100"]
