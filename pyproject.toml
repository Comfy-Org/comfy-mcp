[project]
name = "comfy-local-mcp"
version = "0.1.0"
description = "Local MCP server for ComfyUI — a thin wrapper over comfy-cli."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Comfy Org" }]
dependencies = [
    "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15,<0.16"]

[project.scripts]
comfy-local-mcp = "comfy_local_mcp.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "e2e: live end-to-end smoke test; needs a running local ComfyUI + comfy-cli (skips otherwise)",
]

[tool.ruff]
target-version = "py310"
